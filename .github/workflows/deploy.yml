name: Azure preview deployment
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Website CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: azure-preview
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.AZURE_SWA_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    environment: preview
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Keep the Azure review hostname out of search indexes
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          node --input-type=module -e "import fs from 'node:fs'; const path = 'dist/staticwebapp.config.json'; const config = JSON.parse(fs.readFileSync(path)); config.globalHeaders['X-Robots-Tag'] = 'noindex, nofollow'; fs.writeFileSync(path, JSON.stringify(config));"
      - name: Deploy prebuilt static site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          api_location: ''
